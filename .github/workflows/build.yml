name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q NavaLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Set update URL
        run: sed -i "s#OWNER_REPO#${{ github.repository }}#" NavaLauncher/app/src/main/java/com/mrahmadiaan/nava/ui/SettingsScreen.kt
      - name: Build debug APK
        working-directory: NavaLauncher
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NavaLauncher-APK
          path: NavaLauncher/app/build/outputs/apk/debug/app-debug.apk
